name: Build Openterface KM Firmware (Ubuntu)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # xPack riscv-none-embed-gcc 8.2.0 is the WCH-patched GCC with native rv32imacxw
  # support — the same upstream as the Windows CI toolchain. Do NOT use the newer
  # riscv-none-elf-gcc packages; those are standard upstream GCC without xw.
  XPACK_VERSION: 8.2.0-3.1
  TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain/xPacks/riscv-none-embed-gcc/8.2.0-3.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache RISC-V toolchain
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: ${{ github.workspace }}/.toolchain
          key: ubuntu-xpack-riscv-none-embed-${{ env.XPACK_VERSION }}

      - name: Download and extract xpack RISC-V toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/.toolchain"
          curl -L --progress-bar \
            -o "${{ github.workspace }}/.toolchain/toolchain.tar.gz" \
            "https://github.com/xpack-dev-tools/riscv-none-embed-gcc-xpack/releases/download/v${{ env.XPACK_VERSION }}/xpack-riscv-none-embed-gcc-${{ env.XPACK_VERSION }}-linux-x64.tgz"
          tar -xzf "${{ github.workspace }}/.toolchain/toolchain.tar.gz" \
            -C "${{ github.workspace }}/.toolchain"

      - name: Verify toolchain in PATH
        run: |
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          echo "TOOLCHAIN_DIR=${{ env.TOOLCHAIN_DIR }}"
          ls -la "${{ env.TOOLCHAIN_DIR }}/bin"
          command -v riscv-none-embed-gcc
          riscv-none-embed-gcc --version | head -n 1

      - name: Build KVMGo (version 1)
        run: |
          echo "Building KVMGo..."
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          cd "${{ github.workspace }}/build"
          make clean
          make -j$(nproc) ENABLE_BLE=1 BOARD_VERSION=1 all

          cp openterface-km-firmware.hex openterface-km-firmware-kvmgo.hex
          echo "KVMGo build succeeded"

      - name: Build Mini-KVM v1.2 (version 2)
        run: |
          echo "Building Mini-KVM v1.2..."
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          cd "${{ github.workspace }}/build"
          make clean
          make -j$(nproc) ENABLE_BLE=1 BOARD_VERSION=2 all

          cp openterface-km-firmware.hex openterface-km-firmware-mini-kvm.hex
          echo "Mini-KVM v1.2 build succeeded"

      - name: Build KeyMod v1.0 BLE (version 3)
        run: |
          echo "Building KeyMod v1.0 (BLE)..."
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          cd "${{ github.workspace }}/build"
          make clean
          make -j$(nproc) ENABLE_BLE=1 BOARD_VERSION=3 all

          cp openterface-km-firmware.hex openterface-km-firmware-keymod-ble.hex
          echo "KeyMod v1.0 BLE build succeeded"

      - name: Upload KVMGo firmware
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-kvmgo
          if-no-files-found: error
          path: ${{ github.workspace }}/build/openterface-km-firmware-kvmgo.hex

      - name: Upload Mini-KVM v1.2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-mini-kvm-v1.2
          if-no-files-found: error
          path: ${{ github.workspace }}/build/openterface-km-firmware-mini-kvm.hex

      - name: Upload KeyMod v1.0 BLE firmware
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-keymod-v1.0-ble
          if-no-files-found: error
          path: ${{ github.workspace }}/build/openterface-km-firmware-keymod-ble.hex
