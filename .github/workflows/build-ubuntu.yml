name: Build Openterface KM Firmware (Ubuntu)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # xPack riscv-none-embed-gcc 8.2.0 is the WCH-patched GCC with native rv32imacxw
  # support — the same upstream as the Windows CI toolchain. Do NOT use the newer
  # riscv-none-elf-gcc packages; those are standard upstream GCC without xw.
  XPACK_VERSION: 8.2.0-3.1
  TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain/xPacks/riscv-none-embed-gcc/8.2.0-3.1
  WRAPPERS_DIR: ${{ github.workspace }}/.toolchain/wrappers
  RAM_GUARD_BYTES: 61440

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache RISC-V toolchain
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: ${{ github.workspace }}/.toolchain
          key: ubuntu-xpack-riscv-none-embed-${{ env.XPACK_VERSION }}

      - name: Download and extract xpack RISC-V toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/.toolchain"
          curl -L --progress-bar \
            -o "${{ github.workspace }}/.toolchain/toolchain.tar.gz" \
            "https://github.com/xpack-dev-tools/riscv-none-embed-gcc-xpack/releases/download/v${{ env.XPACK_VERSION }}/xpack-riscv-none-embed-gcc-${{ env.XPACK_VERSION }}-linux-x64.tgz"
          tar -xzf "${{ github.workspace }}/.toolchain/toolchain.tar.gz" \
            -C "${{ github.workspace }}/.toolchain"

      - name: Verify toolchain in PATH
        run: |
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          echo "TOOLCHAIN_DIR=${{ env.TOOLCHAIN_DIR }}"
          ls -la "${{ env.TOOLCHAIN_DIR }}/bin"
          command -v riscv-none-embed-gcc
          riscv-none-embed-gcc --version | head -n 1

      - name: Prepare xw compatibility wrappers
        run: |
          TOOLBIN="${{ env.TOOLCHAIN_DIR }}/bin"
          WRAPDIR="${{ env.WRAPPERS_DIR }}"
          mkdir -p "$WRAPDIR"

          # Default pass-through wrappers for tools used by make.
          for tool in g++ objcopy size ar as nm ranlib addr2line readelf strings strip c++filt; do
            printf '#!/bin/sh\nexec "%s/riscv-none-embed-%s" "$@"\n' "$TOOLBIN" "$tool" \
              > "$WRAPDIR/riscv-none-embed-$tool"
            chmod +x "$WRAPDIR/riscv-none-embed-$tool"
          done

          # Probe native rv32imacxw support in this compiler.
          printf 'int f(void){return 1;}\n' > /tmp/xw_probe.c
          if "$TOOLBIN/riscv-none-embed-gcc" -march=rv32imacxw -mabi=ilp32 -c /tmp/xw_probe.c -o /tmp/xw_probe.o >/dev/null 2>&1; then
            echo "Compiler supports rv32imacxw natively"
            printf '#!/bin/sh\nexec "%s/riscv-none-embed-gcc" "$@"\n' "$TOOLBIN" \
              > "$WRAPDIR/riscv-none-embed-gcc"
            printf '#!/bin/sh\nexec "%s/riscv-none-embed-objdump" "$@"\n' "$TOOLBIN" \
              > "$WRAPDIR/riscv-none-embed-objdump"
          else
            echo "Compiler does not support rv32imacxw, enabling compatibility translation"

            # GCC wrapper: map proprietary xw to a baseline arch accepted by older GCC.
            printf '%s\n' \
              '#!/bin/bash' \
              'TOOLBIN="${{ env.TOOLCHAIN_DIR }}/bin"' \
              'args=()' \
              'for arg in "$@"; do' \
              '  args+=("${arg//rv32imacxw/rv32imac}")' \
              'done' \
              'exec "$TOOLBIN/riscv-none-embed-gcc" "${args[@]}"' \
              > "$WRAPDIR/riscv-none-embed-gcc"

            # objdump wrapper: remove unsupported '-M xw' so listing generation succeeds.
            printf '%s\n' \
              '#!/bin/bash' \
              'TOOLBIN="${{ env.TOOLCHAIN_DIR }}/bin"' \
              'args=()' \
              'skip_next=0' \
              'for arg in "$@"; do' \
              '  if [[ "$skip_next" -eq 1 ]]; then' \
              '    if [[ "$arg" == "xw" ]]; then' \
              '      skip_next=0' \
              '      continue' \
              '    fi' \
              '    args+=("-M" "$arg")' \
              '    skip_next=0' \
              '    continue' \
              '  fi' \
              '  if [[ "$arg" == "-M" ]]; then' \
              '    skip_next=1' \
              '    continue' \
              '  fi' \
              '  args+=("$arg")' \
              'done' \
              'if [[ "$skip_next" -eq 1 ]]; then' \
              '  args+=("-M")' \
              'fi' \
              'exec "$TOOLBIN/riscv-none-embed-objdump" "${args[@]}"' \
              > "$WRAPDIR/riscv-none-embed-objdump"
          fi

          chmod +x "$WRAPDIR/riscv-none-embed-gcc" "$WRAPDIR/riscv-none-embed-objdump"
          export PATH="$WRAPDIR:$TOOLBIN:$PATH"
          command -v riscv-none-embed-gcc
          riscv-none-embed-gcc --version | head -n 1

      - name: Build KVMGo (version 1)
        run: |
          echo "Building KVMGo..."
          export PATH="${{ env.WRAPPERS_DIR }}:${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          cd "${{ github.workspace }}/build"
          make clean
          make -j$(nproc) ENABLE_BLE=1 BOARD_VERSION=1 all

          # Ensure .siz exists as a file for artifact upload.
          riscv-none-embed-size --format=berkeley openterface-km-firmware.elf > openterface-km-firmware.siz

          # RAM guard: fail fast if runtime RAM footprint is too close to 64 KB.
          RAM_USED=$(riscv-none-embed-size -A openterface-km-firmware.elf | awk '$1==".data"{d=$2} $1==".bss"{b=$2} $1==".stack"{s=$2} END{print d+b+s}')
          echo "KVMGo RAM_USED=${RAM_USED} bytes"
          if [ "$RAM_USED" -gt "${{ env.RAM_GUARD_BYTES }}" ]; then
            echo "ERROR: KVMGo RAM usage ${RAM_USED} exceeds guard ${{ env.RAM_GUARD_BYTES }}"
            exit 1
          fi

          cp openterface-km-firmware.hex openterface-km-firmware-kvmgo.hex
          cp openterface-km-firmware.elf openterface-km-firmware-kvmgo.elf
          cp openterface-km-firmware.map openterface-km-firmware-kvmgo.map
          cp openterface-km-firmware.siz openterface-km-firmware-kvmgo.siz
          echo "KVMGo build succeeded"

      - name: Build Mini-KVM v1.2 (version 2)
        run: |
          echo "Building Mini-KVM v1.2..."
          export PATH="${{ env.WRAPPERS_DIR }}:${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          cd "${{ github.workspace }}/build"
          make clean
          make -j$(nproc) ENABLE_BLE=1 BOARD_VERSION=2 all

          riscv-none-embed-size --format=berkeley openterface-km-firmware.elf > openterface-km-firmware.siz

          RAM_USED=$(riscv-none-embed-size -A openterface-km-firmware.elf | awk '$1==".data"{d=$2} $1==".bss"{b=$2} $1==".stack"{s=$2} END{print d+b+s}')
          echo "Mini-KVM RAM_USED=${RAM_USED} bytes"
          if [ "$RAM_USED" -gt "${{ env.RAM_GUARD_BYTES }}" ]; then
            echo "ERROR: Mini-KVM RAM usage ${RAM_USED} exceeds guard ${{ env.RAM_GUARD_BYTES }}"
            exit 1
          fi

          cp openterface-km-firmware.hex openterface-km-firmware-mini-kvm.hex
          cp openterface-km-firmware.elf openterface-km-firmware-mini-kvm.elf
          cp openterface-km-firmware.map openterface-km-firmware-mini-kvm.map
          cp openterface-km-firmware.siz openterface-km-firmware-mini-kvm.siz
          echo "Mini-KVM v1.2 build succeeded"

      - name: Build KeyMod v1.0 BLE (version 3)
        run: |
          echo "Building KeyMod v1.0 (BLE)..."
          export PATH="${{ env.WRAPPERS_DIR }}:${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
          cd "${{ github.workspace }}/build"
          make clean
          make -j$(nproc) ENABLE_BLE=1 BOARD_VERSION=3 all

          riscv-none-embed-size --format=berkeley openterface-km-firmware.elf > openterface-km-firmware.siz

          RAM_USED=$(riscv-none-embed-size -A openterface-km-firmware.elf | awk '$1==".data"{d=$2} $1==".bss"{b=$2} $1==".stack"{s=$2} END{print d+b+s}')
          echo "KeyMod BLE RAM_USED=${RAM_USED} bytes"
          if [ "$RAM_USED" -gt "${{ env.RAM_GUARD_BYTES }}" ]; then
            echo "ERROR: KeyMod BLE RAM usage ${RAM_USED} exceeds guard ${{ env.RAM_GUARD_BYTES }}"
            exit 1
          fi

          cp openterface-km-firmware.hex openterface-km-firmware-keymod-ble.hex
          cp openterface-km-firmware.elf openterface-km-firmware-keymod-ble.elf
          cp openterface-km-firmware.map openterface-km-firmware-keymod-ble.map
          cp openterface-km-firmware.siz openterface-km-firmware-keymod-ble.siz
          echo "KeyMod v1.0 BLE build succeeded"

      - name: Upload KVMGo firmware
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-kvmgo
          if-no-files-found: error
          path: ${{ github.workspace }}/build/openterface-km-firmware-kvmgo.hex

      - name: Upload KVMGo diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-kvmgo-diagnostics
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/build/openterface-km-firmware-kvmgo.elf
            ${{ github.workspace }}/build/openterface-km-firmware-kvmgo.map
            ${{ github.workspace }}/build/openterface-km-firmware-kvmgo.siz

      - name: Upload Mini-KVM v1.2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-mini-kvm-v1.2
          if-no-files-found: error
          path: ${{ github.workspace }}/build/openterface-km-firmware-mini-kvm.hex

      - name: Upload Mini-KVM v1.2 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-mini-kvm-v1.2-diagnostics
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/build/openterface-km-firmware-mini-kvm.elf
            ${{ github.workspace }}/build/openterface-km-firmware-mini-kvm.map
            ${{ github.workspace }}/build/openterface-km-firmware-mini-kvm.siz

      - name: Upload KeyMod v1.0 BLE firmware
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-keymod-v1.0-ble
          if-no-files-found: error
          path: ${{ github.workspace }}/build/openterface-km-firmware-keymod-ble.hex

      - name: Upload KeyMod v1.0 BLE diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: openterface-km-firmware-keymod-v1.0-ble-diagnostics
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/build/openterface-km-firmware-keymod-ble.elf
            ${{ github.workspace }}/build/openterface-km-firmware-keymod-ble.map
            ${{ github.workspace }}/build/openterface-km-firmware-keymod-ble.siz
