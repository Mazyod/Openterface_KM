name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: Mark as pre-release
        required: false
        default: false
        type: boolean
      enable_uac:
        description: 'Build: enable USB Audio Class (UAC)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      enable_ble:
        description: 'Build: enable Bluetooth Low Energy (BLE)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

permissions:
  contents: write

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      prev: ${{ steps.bump.outputs.prev }}
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          bump="${{ inputs.bump }}"

          # Grab the latest semver tag from the repo. If none exists, start from v0.0.0.
          prev=$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)
          if [[ -z "$prev" ]]; then
            echo "No existing release tag found. Starting from v0.0.0."
            prev="v0.0.0"
          else
            echo "Latest tag: $prev"
          fi

          # Strip leading 'v' and any pre-release suffix for math
          base="${prev#v}"
          base="${base%%[!0-9.]*}"  # drop -rc.1 etc.
          IFS='.' read -r M m p <<< "$base"
          M=${M:-0}; m=${m:-0}; p=${p:-0}

          case "$bump" in
            major) M=$((M+1)); m=0; p=0 ;;
            minor) m=$((m+1)); p=0 ;;
            patch) p=$((p+1)) ;;
            *) echo "::error::Unknown bump level '$bump'" ; exit 1 ;;
          esac

          new="v${M}.${m}.${p}"
          echo "Bump: $bump -> $prev  ->  $new"
          echo "tag=$new" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      enable_uac: ${{ inputs.enable_uac }}
      enable_ble: ${{ inputs.enable_ble }}

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PREV: ${{ needs.version.outputs.prev }}
    steps:
      - name: Download KVMGo firmware
        uses: actions/download-artifact@v4
        with:
          name: openterface-km-firmware-kvmgo
          path: artifacts/kvmgo

      - name: Download Mini-KVM v1.2 firmware
        uses: actions/download-artifact@v4
        with:
          name: openterface-km-firmware-mini-kvm-v1.2
          path: artifacts/mini-kvm

      - name: Download KeyMod Plus firmware
        uses: actions/download-artifact@v4
        with:
          name: openterface-km-firmware-keymod-plus
          path: artifacts/keymod-plus

      - name: Download KeyMod Mini firmware
        uses: actions/download-artifact@v4
        with:
          name: openterface-km-firmware-keymod-mini
          path: artifacts/keymod-mini

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/kvmgo/*.hex
            artifacts/kvmgo/*.bin
            artifacts/mini-kvm/*.hex
            artifacts/mini-kvm/*.bin
            artifacts/keymod-plus/*.hex
            artifacts/keymod-plus/*.bin
            artifacts/keymod-mini/*.hex
            artifacts/keymod-mini/*.bin
